<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>HTML Viewer — Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --ink: #0d1117;
    --panel: #12181f;
    --panel-2: #161d26;
    --paper: #f4f1ea;
    --amber: #e8a33d;
    --teal: #4fb3a3;
    --red: #e06565;
    --line: #232b35;
    --text-dim: #7c8a99;
    --text: #d8dee6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    overflow:hidden;
    -webkit-text-size-adjust:none;
    text-size-adjust:none;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* Top bar */
  .topbar{
    height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 8px var(--amber);
  }
  .brand h1{
    font-size:15px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:600;
    margin:0;
    color:var(--paper);
  }
  .brand .tag{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    border:1px solid var(--line);
    padding:2px 8px;
    border-radius:20px;
  }
  .actions{display:flex; gap:8px;}
  button{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    font-weight:600;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    transition:all .15s ease;
  }
  button:hover{ border-color:var(--amber); color:var(--paper); }
  button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  button.primary{
    background:var(--amber);
    color:#1b1305;
    border-color:var(--amber);
  }
  button.primary:hover{ filter:brightness(1.08); color:#1b1305; }
  button.ghost{ background:transparent; }
  button.danger:hover{ border-color:var(--red); color:var(--red); }

  /* Body split */
  .workspace{
    display:flex;
    height:calc(100% - 56px - 30px);
  }
  .pane{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .pane-head{
    height:34px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 14px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    border-bottom:1px solid var(--line);
    background:var(--panel);
    flex-shrink:0;
  }
  .pane-head .num{ color:var(--amber); }

  /* Vùng soạn mã: textarea (trên) + lớp nền tô màu (dưới) */
  .editor-wrap{
    position:relative;
    flex:1;
    background:var(--ink);
    overflow:hidden;
  }
  #editor{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    resize:none;
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    caret-color:var(--amber);
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    font-weight:400;
    font-style:normal;
    line-height:21.6px;
    letter-spacing:0;
    word-spacing:0;
    text-indent:0;
    text-transform:none;
    font-variant-ligatures:none;
    font-kerning:none;
    -webkit-text-size-adjust:none;
    text-size-adjust:none;
    -webkit-appearance:none;
    appearance:none;
    margin:0;
    padding:16px 18px;
    tab-size:2;
    -moz-tab-size:2;
    white-space:pre;
    overflow-wrap:normal;
    word-break:normal;
    overflow:auto;
  }
  #editor::selection{ background:rgba(232,163,61,0.25); }

  .hl-backdrop{
    position:absolute;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .hl-inner{
    display:block;
    width:100%;
    min-width:100%;
    margin:0;
    border:0;
    padding:16px 18px;
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    font-weight:400;
    font-style:normal;
    line-height:21.6px;
    letter-spacing:0;
    word-spacing:0;
    text-indent:0;
    text-transform:none;
    font-variant-ligatures:none;
    font-kerning:none;
    -webkit-text-size-adjust:none;
    text-size-adjust:none;
    tab-size:2;
    -moz-tab-size:2;
    white-space:pre;
    word-break:normal;
    color:transparent;
    will-change:transform;
  }
  .hl-inner mark{
    color:transparent;
    background:rgba(232,163,61,0.32);
    padding:0;
    margin:0;
    border:0;
    font:inherit;
    letter-spacing:inherit;
  }
  .hl-inner mark.cur{
    background:rgba(232,163,61,0.75);
    outline:1px solid var(--amber);
  }

  /* Thanh tìm kiếm */
  .find-bar{
    position:absolute;
    top:10px;
    right:18px;
    z-index:5;
    display:flex;
    align-items:center;
    gap:4px;
    padding:6px 8px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
  }
  .find-bar[hidden]{ display:none; }
  .find-bar input{
    width:170px;
    background:var(--ink);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:5px;
    padding:5px 8px;
    font-size:12.5px;
    outline:none;
  }
  .find-bar input:focus{ border-color:var(--amber); }
  .find-bar button{
    padding:4px 8px;
    font-size:12px;
    border-radius:5px;
    background:transparent;
    border-color:transparent;
    color:var(--text-dim);
    line-height:1.2;
  }
  .find-bar button:hover{ color:var(--paper); border-color:var(--line); }
  .find-bar .find-opt[aria-pressed="true"]{
    color:#1b1305;
    background:var(--amber);
    border-color:var(--amber);
  }
  .find-count{
    font-size:11px;
    color:var(--text-dim);
    min-width:52px;
    text-align:center;
    white-space:nowrap;
  }
  .find-count.none{ color:var(--red); }

  .divider{
    width:1px;
    background:var(--line);
    flex-shrink:0;
  }

  .browser-chrome{
    height:34px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .traffic{ display:flex; gap:6px; flex-shrink:0; }
  .traffic i{ width:9px; height:9px; border-radius:50%; display:block; opacity:0.85; }
  .chrome-btn{
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-size:15px;
    line-height:1;
    padding:2px 4px;
    border-radius:4px;
    cursor:pointer;
    flex-shrink:0;
  }
  .chrome-btn:hover{ color:var(--paper); background:var(--panel-2); }
  .chrome-btn:focus-visible{ outline:2px solid var(--amber); outline-offset:1px; }
  .address-bar{
    flex:1;
    min-width:0;
    background:var(--ink);
    border:1px solid var(--line);
    border-radius:20px;
    padding:5px 14px;
    font-size:11.5px;
    color:var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  #preview-frame{
    flex:1;
    width:100%;
    border:none;
    background:var(--paper);
  }

  .preview-wrap{ position:relative; flex:1; display:flex; }
  .empty-state{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:var(--paper);
    color:#8a8478;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    text-align:center;
    padding:20px;
  }
  .empty-state strong{ color:#3a362e; font-family:'Space Grotesk',sans-serif; font-size:15px; }

  /* Status bar */
  .statusbar{
    height:30px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:var(--panel);
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
  }
  .statusbar .status-ok{ color:var(--teal); }
  .statusbar .status-err{ color:var(--red); }
  .statusbar span{ display:flex; align-items:center; gap:6px; }

  @media (max-width: 860px){
    .workspace{ flex-direction:column; }
    .divider{ width:100%; height:1px; }
    .topbar{ flex-wrap:wrap; height:auto; gap:10px; padding:12px; }
  }

  @media (pointer:coarse){
    .find-bar input{ font-size:16px; width:140px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>HTML Viewer</h1>
      <span class="tag mono">console v1</span>
    </div>
    <div class="actions">
      <button class="ghost" id="btnFind" title="Tìm kiếm (Ctrl+F / Ctrl+G)">⌕ Tìm</button>
      <button class="ghost" id="btnSample">Nạp mẫu</button>
      <button class="danger ghost" id="btnClear">Xoá</button>
      <button id="btnDownload">Tải .html</button>
      <button id="btnOpenTab">↗ Mở tab riêng</button>
      <button class="primary" id="btnRun">▶ Chạy (Ctrl+Enter)</button>
    </div>
  </div>

  <div class="workspace">
    <div class="pane">
      <div class="pane-head"><span class="num">01</span> mã nguồn</div>
      <div class="editor-wrap">
        <div class="find-bar" id="findBar" role="search" hidden>
          <input type="text" id="findInput" class="mono" placeholder="Tìm trong mã…" autocomplete="off" spellcheck="false" aria-label="Tìm kiếm">
          <button type="button" class="find-opt" id="findCase" title="Phân biệt hoa/thường" aria-pressed="false">Aa</button>
          <span class="find-count mono" id="findCount">0/0</span>
          <button type="button" id="findPrev" title="Kết quả trước (Shift+Enter)" aria-label="Kết quả trước">↑</button>
          <button type="button" id="findNext" title="Kết quả sau (Enter)" aria-label="Kết quả sau">↓</button>
          <button type="button" id="findClose" title="Đóng (Esc)" aria-label="Đóng tìm kiếm">✕</button>
        </div>
        <textarea id="editor" class="mono" wrap="off" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
        <div class="hl-backdrop" aria-hidden="true"><pre class="hl-inner" id="hlInner"></pre></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="pane">
      <div class="browser-chrome">
        <span class="traffic"><i style="background:#e06565"></i><i style="background:#e8a33d"></i><i style="background:#4fb3a3"></i></span>
        <button class="chrome-btn" id="btnReload" title="Tải lại" aria-label="Tải lại trang xem trước">⟳</button>
        <div class="address-bar mono" id="addressBar">xem-truoc.html</div>
      </div>
      <div class="preview-wrap">
        <div class="empty-state" id="emptyState">
          <strong>Chưa có gì để hiển thị</strong>
          <span>Dán mã HTML vào ô bên trái rồi nhấn Chạy</span>
        </div>
        <iframe id="preview-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups" style="display:none;"></iframe>
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span id="statusLeft" class="status-ok">● sẵn sàng</span>
    <span id="statusRight" class="mono">0 ký tự</span>
  </div>

<script>
  const editor = document.getElementById('editor');
  const frame = document.getElementById('preview-frame');
  const emptyState = document.getElementById('emptyState');
  const statusLeft = document.getElementById('statusLeft');
  const statusRight = document.getElementById('statusRight');

  const SAMPLE = `<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trang mẫu</title>
<style>
  body{ font-family: sans-serif; background:#fdf6e3; padding:40px; text-align:center; }
  h1{ color:#cb4b16; }
  button{ padding:10px 20px; border-radius:8px; border:none; background:#268bd2; color:white; cursor:pointer; }
</style>
</head>
<body>
  <h1>Xin chào 👋</h1>
  <p>Đây là trang HTML mẫu. Sửa mã bên trái và nhấn Chạy để xem thay đổi.</p>
  <button onclick="alert('Bạn vừa nhấn nút!')">Nhấn vào đây</button>
</body>
</html>`;

  function render(){
    const code = editor.value;
    statusRight.textContent = code.length.toLocaleString('vi-VN') + ' ký tự';

    if(code.trim() === ''){
      frame.style.display = 'none';
      emptyState.style.display = 'flex';
      statusLeft.className = 'status-ok';
      statusLeft.textContent = '● sẵn sàng';
      return;
    }

    emptyState.style.display = 'none';
    frame.style.display = 'block';

    try{
      frame.srcdoc = code;
      statusLeft.className = 'status-ok';
      statusLeft.textContent = '● đã hiển thị lúc ' + new Date().toLocaleTimeString('vi-VN');
    }catch(e){
      statusLeft.className = 'status-err';
      statusLeft.textContent = '✕ lỗi hiển thị: ' + e.message;
    }
  }

  document.getElementById('btnRun').addEventListener('click', render);
  document.getElementById('btnReload').addEventListener('click', render);
  document.getElementById('btnClear').addEventListener('click', () => {
    editor.value = '';
    render();
    editor.focus();
  });
  document.getElementById('btnSample').addEventListener('click', () => {
    editor.value = SAMPLE;
    render();
  });
  document.getElementById('btnOpenTab').addEventListener('click', () => {
    const code = editor.value;
    if(code.trim() === ''){
      statusLeft.className = 'status-err';
      statusLeft.textContent = '✕ chưa có mã để mở';
      return;
    }
    const blob = new Blob([code], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const win = window.open(url, '_blank');
    if(!win){
      statusLeft.className = 'status-err';
      statusLeft.textContent = '✕ trình duyệt đã chặn cửa sổ mới — hãy cho phép popup';
      URL.revokeObjectURL(url);
      return;
    }
    statusLeft.className = 'status-ok';
    statusLeft.textContent = '● đã mở tab riêng lúc ' + new Date().toLocaleTimeString('vi-VN');
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  });

  document.getElementById('btnDownload').addEventListener('click', () => {
    const blob = new Blob([editor.value || ''], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'trang-cua-toi.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  editor.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      render();
    }
    // Hỗ trợ phím Tab
    if(e.key === 'Tab'){
      e.preventDefault();
      const start = editor.selectionStart, end = editor.selectionEnd;
      editor.value = editor.value.substring(0,start) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      editor.dispatchEvent(new Event('input'));
    }
  });

  editor.addEventListener('input', () => {
    statusRight.textContent = editor.value.length.toLocaleString('vi-VN') + ' ký tự';
  });

  /* =========================================================
     TÌM KIẾM (Ctrl+F / Ctrl+G) + TÔ MÀU CHỮ ĐANG TÌM
  ========================================================= */
  const findBar = document.getElementById('findBar');
  const findInput = document.getElementById('findInput');
  const findCount = document.getElementById('findCount');
  const findCaseBtn = document.getElementById('findCase');
  const hlInner = document.getElementById('hlInner');
  let matches = [];
  let curIdx = -1;

  const caseSensitive = () => findCaseBtn.getAttribute('aria-pressed') === 'true';

  function escapeHTML(s){
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Giữ lớp tô màu luôn trùng vị trí với chữ khi cuộn
  function syncScroll(){
    hlInner.style.transform = 'translate(' + (-editor.scrollLeft) + 'px,' + (-editor.scrollTop) + 'px)';
  }
  editor.addEventListener('scroll', syncScroll);

  function clearHighlights(){
    hlInner.textContent = '';
  }

  function paintHighlights(){
    const len = findInput.value.length;
    if(findBar.hidden || !len || matches.length === 0){
      clearHighlights();
      return;
    }
    const text = editor.value;
    let html = '', last = 0;
    matches.forEach((s, i) => {
      html += escapeHTML(text.slice(last, s));
      html += '<mark' + (i === curIdx ? ' class="cur"' : '') + '>' + escapeHTML(text.slice(s, s + len)) + '</mark>';
      last = s + len;
    });
    html += escapeHTML(text.slice(last)) + '\n';
    hlInner.innerHTML = html;
    syncScroll();
  }

  function computeMatches(){
    matches = [];
    const q = findInput.value;
    if(!q) return;
    const cs = caseSensitive();
    const text = editor.value;
    const hay = cs ? text : text.toLowerCase();
    const needle = cs ? q : q.toLowerCase();
    let i = 0;
    while((i = hay.indexOf(needle, i)) !== -1){
      matches.push(i);
      i += needle.length;
    }
  }

  // Cuộn (dọc + ngang) tới vị trí kết quả
  function scrollToIndex(index){
    const cs = getComputedStyle(editor);
    const m = document.createElement('pre');
    m.style.cssText = 'position:absolute;visibility:hidden;top:0;left:-99999px;margin:0;border:0;white-space:pre;-webkit-text-size-adjust:none;text-size-adjust:none;';
    ['fontFamily','fontSize','fontWeight','lineHeight','paddingTop','paddingRight','paddingBottom','paddingLeft','tabSize','letterSpacing','fontVariantLigatures','fontKerning'].forEach(p => m.style[p] = cs[p]);
    m.textContent = editor.value.slice(0, index);
    const marker = document.createElement('span');
    marker.textContent = '\u200b';
    m.appendChild(marker);
    document.body.appendChild(m);
    const top = marker.offsetTop, left = marker.offsetLeft;
    m.remove();
    const lh = parseFloat(cs.lineHeight) || 21.6;
    if(top < editor.scrollTop + lh || top > editor.scrollTop + editor.clientHeight - lh * 2){
      editor.scrollTop = Math.max(0, top - editor.clientHeight / 2);
    }
    if(left < editor.scrollLeft + 24 || left > editor.scrollLeft + editor.clientWidth - 80){
      editor.scrollLeft = Math.max(0, left - editor.clientWidth / 3);
    }
  }

  function showResult(cur, incremental){
    const q = findInput.value;
    curIdx = cur;
    findCount.classList.toggle('none', !!q && matches.length === 0);
    if(!q){ findCount.textContent = '0/0'; paintHighlights(); return; }
    if(matches.length === 0){ findCount.textContent = 'Không có'; paintHighlights(); return; }
    findCount.textContent = (cur + 1) + '/' + matches.length;
    const s = matches[cur];
    // Khi đang gõ (incremental) không đổi focus để không làm gián đoạn bộ gõ tiếng Việt
    if(!incremental) editor.focus();
    editor.setSelectionRange(s, s + q.length);
    scrollToIndex(s);
    if(!incremental) findInput.focus();
    paintHighlights();
  }

  // dir: 1 = sau, -1 = trước, 0 = gõ tới đâu tìm tới đó
  function step(dir){
    computeMatches();
    if(matches.length === 0){ showResult(-1); return; }
    let cur;
    if(dir >= 0){
      const from = dir === 0 ? editor.selectionStart : editor.selectionEnd;
      cur = matches.findIndex(m => m >= from);
      if(cur === -1) cur = 0;
    }else{
      cur = -1;
      for(let i = matches.length - 1; i >= 0; i--){
        if(matches[i] < editor.selectionStart){ cur = i; break; }
      }
      if(cur === -1) cur = matches.length - 1;
    }
    showResult(cur, dir === 0);
  }

  // Khi nội dung bị sửa lúc đang mở tìm kiếm: tính lại và tô màu lại
  function refreshFindLive(){
    if(findBar.hidden || !findInput.value) return;
    computeMatches();
    curIdx = -1;
    findCount.classList.toggle('none', matches.length === 0);
    findCount.textContent = matches.length ? '–/' + matches.length : 'Không có';
    paintHighlights();
  }
  editor.addEventListener('input', refreshFindLive);
  document.getElementById('btnSample').addEventListener('click', refreshFindLive);
  document.getElementById('btnClear').addEventListener('click', refreshFindLive);

  function openFind(){
    const sel = editor.value.substring(editor.selectionStart, editor.selectionEnd);
    findBar.hidden = false;
    if(sel && !sel.includes('\n')) findInput.value = sel;
    findInput.focus();
    findInput.select();
    if(findInput.value) step(0);
  }
  function closeFind(){
    findBar.hidden = true;
    matches = [];
    curIdx = -1;
    clearHighlights();
    editor.focus();
  }

  document.getElementById('btnFind').addEventListener('click', openFind);
  document.getElementById('findNext').addEventListener('click', () => step(1));
  document.getElementById('findPrev').addEventListener('click', () => step(-1));
  document.getElementById('findClose').addEventListener('click', closeFind);
  findCaseBtn.addEventListener('click', () => {
    findCaseBtn.setAttribute('aria-pressed', String(!caseSensitive()));
    step(0);
  });
  findInput.addEventListener('input', () => step(0));
  findInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); step(e.shiftKey ? -1 : 1); }
    else if(e.key === 'Escape'){ e.preventDefault(); closeFind(); }
  });

  // Ctrl+F / Ctrl+G (Cmd trên Mac): mở tìm kiếm; khi đã mở thì Ctrl+G = kết quả tiếp theo
  document.addEventListener('keydown', (e) => {
    if(!(e.ctrlKey || e.metaKey)) return;
    const k = e.key.toLowerCase();
    if(k === 'f'){
      e.preventDefault();
      openFind();
    }else if(k === 'g'){
      e.preventDefault();
      if(findBar.hidden) openFind();
      else step(e.shiftKey ? -1 : 1);
    }
  });

  // Nạp mẫu khi mở lần đầu
  editor.value = SAMPLE;
  render();
</script>

</body>
</html>
